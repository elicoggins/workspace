[package]
name = "workspace"
version = "0.1.0"
edition = "2021"
description = "Save and restore macOS window layouts."
readme = "README.md"
license = "MIT"
publish = false

[[bin]]
name = "workspace"
path = "src/main.rs"

[dependencies]
anstyle = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
core-foundation = "0.10"
core-graphics = "0.24"
dirs = "5.0"
dialoguer = "0.11"
libc = "0.2"
objc = "0.2"
serde = { version = "1.0", features = ["derive"] }
# Keep window geometry exact through JSON round trips.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.10"
proptest = "1.5"

[lints.rust]
# objc macros emit this legacy feature check in the calling crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
